<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>머니로그 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', sans-serif; }
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin .8s linear infinite; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

<!-- ── 로그인 ── -->
<div id="loginSection" class="flex items-center justify-center min-h-screen px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600 mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-900">머니로그 관리자</h1>
      <p class="text-sm text-gray-500 mt-1">Firebase Database Secret으로 로그인</p>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Database Secret</label>
        <input id="secretInput" type="password" placeholder="Firebase Console에서 복사"
          class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition mono">
        <p class="text-xs text-gray-400 mt-1.5">
          Firebase Console → 프로젝트 설정 → 서비스 계정 → Database Secrets
        </p>
      </div>
      <button onclick="adminLogin()" id="loginBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2.5 text-sm font-semibold transition flex items-center justify-center gap-2">
        <span id="loginBtnText">로그인</span>
      </button>
      <p id="loginError" class="text-red-500 text-xs mt-2 text-center hidden">인증 실패. Secret을 다시 확인해주세요.</p>
    </div>
  </div>
</div>

<!-- ── 대시보드 ── -->
<div id="dashSection" class="hidden min-h-screen">

  <!-- 헤더 -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <span class="font-bold text-sm text-gray-900">머니로그 관리자</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="loadRooms()" title="새로고침"
          class="flex items-center gap-1.5 text-xs font-semibold text-gray-500 hover:text-gray-800 bg-gray-100 hover:bg-gray-200 rounded-lg px-2.5 py-1.5 transition">
          <svg xmlns="http://www.w3.org/2000/svg" id="refreshIcon" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          새로고침
        </button>
        <button onclick="adminLogout()"
          class="text-xs font-semibold text-gray-400 hover:text-gray-700 transition">로그아웃</button>
      </div>
    </div>
  </header>

  <!-- 본문 -->
  <main class="max-w-5xl mx-auto px-4 py-6 space-y-5">

    <!-- 통계 카드 -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">전체 룸</p>
        <p id="statRooms" class="text-2xl font-bold text-gray-900 mono">—</p>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">거래 건수</p>
        <p id="statTx" class="text-2xl font-bold text-indigo-600 mono">—</p>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">고정지출</p>
        <p id="statFixed" class="text-2xl font-bold text-purple-600 mono">—</p>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">예정지출</p>
        <p id="statPlan" class="text-2xl font-bold text-pink-500 mono">—</p>
      </div>
    </div>

    <!-- 룸 목록 -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-100">
        <h2 class="text-sm font-bold text-gray-700">동기화 룸 목록</h2>
        <span id="roomCount" class="text-xs text-gray-400"></span>
      </div>
      <div id="roomList"></div>
    </div>

  </main>
</div>

<!-- ── 룸 상세 모달 ── -->
<div id="roomModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
  onclick="if(event.target===this)closeRoomModal()">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100 flex-shrink-0">
      <div>
        <h3 id="modalTitle" class="font-bold text-gray-900 mono text-base"></h3>
        <p id="modalSub" class="text-xs text-gray-400 mt-0.5"></p>
      </div>
      <button onclick="closeRoomModal()" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition text-lg">×</button>
    </div>
    <div id="modalContent" class="overflow-y-auto flex-1 p-5"></div>
    <div class="px-5 py-3 border-t border-gray-100 flex justify-end gap-2 flex-shrink-0">
      <button id="modalDeleteBtn" class="text-xs font-semibold text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 rounded-lg px-3 py-1.5 transition">룸 삭제</button>
      <button onclick="closeRoomModal()" class="text-xs font-semibold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg px-3 py-1.5 transition">닫기</button>
    </div>
  </div>
</div>

<script>
const FIREBASE_URL = 'https://money-loge-default-rtdb.firebaseio.com';
let adminSecret = null;
let currentRoomId = null;

/* ── 인증 ── */
async function adminLogin() {
  const secret = document.getElementById('secretInput').value.trim();
  if (!secret) return;

  const btn      = document.getElementById('loginBtn');
  const btnText  = document.getElementById('loginBtnText');
  const errEl    = document.getElementById('loginError');

  btn.disabled = true;
  btnText.textContent = '확인 중…';
  errEl.classList.add('hidden');

  try {
    const res  = await fetch(`${FIREBASE_URL}/rooms.json?shallow=true&auth=${encodeURIComponent(secret)}`);
    const data = await res.json();
    if (data && data.error) throw new Error(data.error);

    adminSecret = secret;
    sessionStorage.setItem('adminSecret', secret);
    showDashboard();
  } catch {
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btnText.textContent = '로그인';
  }
}

function adminLogout() {
  adminSecret = null;
  sessionStorage.removeItem('adminSecret');
  document.getElementById('dashSection').classList.add('hidden');
  document.getElementById('loginSection').classList.remove('hidden');
  document.getElementById('secretInput').value = '';
}

function showDashboard() {
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('dashSection').classList.remove('hidden');
  loadRooms();
}

/* ── 룸 목록 로드 ── */
async function loadRooms() {
  const listEl = document.getElementById('roomList');
  const icon   = document.getElementById('refreshIcon');
  icon.classList.add('spinner');

  listEl.innerHTML = `
    <div class="flex items-center justify-center py-12 gap-2 text-gray-400">
      <svg class="w-4 h-4 spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span class="text-sm">불러오는 중…</span>
    </div>`;

  try {
    const res      = await fetch(`${FIREBASE_URL}/rooms.json?shallow=true&auth=${encodeURIComponent(adminSecret)}`);
    const roomKeys = await res.json();

    if (!roomKeys || typeof roomKeys !== 'object') {
      listEl.innerHTML = `<p class="text-sm text-gray-400 text-center py-12">등록된 룸이 없습니다</p>`;
      setStats(0, 0, 0, 0);
      icon.classList.remove('spinner');
      return;
    }

    const roomIds = Object.keys(roomKeys);
    document.getElementById('roomCount').textContent = `${roomIds.length}개`;

    // 전체 룸 데이터 병렬 조회
    const rooms = await Promise.all(roomIds.map(async id => {
      const r    = await fetch(`${FIREBASE_URL}/rooms/${id}.json?auth=${encodeURIComponent(adminSecret)}`);
      const data = await r.json();
      return { id, data };
    }));

    // 통계 집계
    let totalTx = 0, totalFixed = 0, totalPlan = 0;
    rooms.forEach(({ data }) => {
      if (!data) return;
      try { const o = JSON.parse(data.vml_transactions || '{}'); Object.values(o).forEach(a => totalTx += Array.isArray(a) ? a.length : 0); } catch {}
      try { totalFixed += JSON.parse(data.vml_fixed || '[]').length; } catch {}
      try { totalPlan  += JSON.parse(data.vml_planned || '[]').length; } catch {}
    });
    setStats(roomIds.length, totalTx, totalFixed, totalPlan);

    // 룸 행 렌더링
    if (rooms.length === 0) {
      listEl.innerHTML = `<p class="text-sm text-gray-400 text-center py-12">등록된 룸이 없습니다</p>`;
    } else {
      listEl.innerHTML = rooms.map(({ id, data }) => {
        let txCount = 0, fixedCount = 0, planCount = 0, memberCount = 0;
        if (data) {
          try { const o = JSON.parse(data.vml_transactions || '{}'); Object.values(o).forEach(a => txCount += Array.isArray(a) ? a.length : 0); } catch {}
          try { fixedCount  = JSON.parse(data.vml_fixed   || '[]').length; } catch {}
          try { planCount   = JSON.parse(data.vml_planned || '[]').length; } catch {}
          try { memberCount = JSON.parse(data.vml_members || '[]').length; } catch {}
        }
        return `
          <div class="flex items-center gap-4 px-5 py-3.5 hover:bg-gray-50 transition cursor-pointer border-b border-gray-50 last:border-0"
            onclick="viewRoom('${id}')">
            <div class="w-20 flex-shrink-0">
              <span class="mono font-bold text-base text-gray-900 tracking-[.18em]">${id}</span>
            </div>
            <div class="flex-1 flex flex-wrap gap-x-4 gap-y-1">
              <span class="text-xs text-gray-500">거래 <strong class="text-gray-800">${txCount}건</strong></span>
              <span class="text-xs text-gray-500">고정지출 <strong class="text-gray-800">${fixedCount}건</strong></span>
              <span class="text-xs text-gray-500">예정지출 <strong class="text-gray-800">${planCount}건</strong></span>
              ${memberCount > 0 ? `<span class="text-xs text-gray-500">멤버 <strong class="text-gray-800">${memberCount}명</strong></span>` : ''}
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs text-indigo-500 font-semibold">상세 →</span>
              <button onclick="event.stopPropagation();confirmDelete('${id}')"
                class="text-xs text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg px-2 py-1 transition">삭제</button>
            </div>
          </div>`;
      }).join('');
    }
  } catch (e) {
    listEl.innerHTML = `<p class="text-sm text-red-400 text-center py-12">오류: ${e.message}</p>`;
  }

  icon.classList.remove('spinner');
}

function setStats(rooms, tx, fixed, plan) {
  document.getElementById('statRooms').textContent = rooms.toLocaleString();
  document.getElementById('statTx').textContent    = tx.toLocaleString();
  document.getElementById('statFixed').textContent = fixed.toLocaleString();
  document.getElementById('statPlan').textContent  = plan.toLocaleString();
}

/* ── 룸 상세 ── */
async function viewRoom(roomId) {
  currentRoomId = roomId;
  document.getElementById('modalTitle').textContent = roomId;
  document.getElementById('modalSub').textContent   = '데이터 불러오는 중…';
  document.getElementById('modalContent').innerHTML = `
    <div class="flex items-center justify-center py-8 text-gray-400 gap-2">
      <svg class="w-4 h-4 spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span class="text-sm">불러오는 중…</span>
    </div>`;
  document.getElementById('roomModal').classList.remove('hidden');
  document.getElementById('modalDeleteBtn').onclick = () => confirmDelete(roomId);

  try {
    const res  = await fetch(`${FIREBASE_URL}/rooms/${roomId}.json?auth=${encodeURIComponent(adminSecret)}`);
    const data = await res.json();

    let txCount = 0, fixedCount = 0, planCount = 0, memberCount = 0;
    let txHtml = '', fixedHtml = '', planHtml = '', memberHtml = '';

    // 거래 내역
    if (data?.vml_transactions) {
      try {
        const txObj = JSON.parse(data.vml_transactions);
        const months = Object.entries(txObj).sort((a, b) => b[0].localeCompare(a[0]));
        months.forEach(([, arr]) => txCount += arr.length);
        txHtml = months.map(([ym, txs]) => `
          <div class="mb-3">
            <p class="text-xs font-bold text-gray-500 mb-1">${ym}</p>
            ${txs.map(t => `
              <div class="flex justify-between items-center text-sm py-1.5 border-b border-gray-50">
                <div>
                  <span class="text-gray-800">${t.merchant}</span>
                  <span class="text-xs text-gray-400 ml-1.5">${t.date}</span>
                </div>
                <span class="font-semibold text-gray-900 mono">${t.amount.toLocaleString()}원</span>
              </div>`).join('')}
          </div>`).join('');
      } catch {}
    }

    // 고정지출
    if (data?.vml_fixed) {
      try {
        const fixed = JSON.parse(data.vml_fixed);
        fixedCount = fixed.length;
        fixedHtml  = fixed.map(f => `
          <div class="flex justify-between items-center text-sm py-1.5 border-b border-gray-50">
            <span class="text-gray-800">${f.name} <span class="text-xs text-gray-400">${f.category}</span></span>
            <span class="font-semibold mono">${f.amount.toLocaleString()}원</span>
          </div>`).join('');
      } catch {}
    }

    // 예정지출
    if (data?.vml_planned) {
      try {
        const planned = JSON.parse(data.vml_planned);
        planCount = planned.length;
        planHtml  = planned.map(p => `
          <div class="flex justify-between items-center text-sm py-1.5 border-b border-gray-50">
            <div>
              <span class="text-gray-800">${p.name}</span>
              <span class="text-xs text-gray-400 ml-1.5">${p.date}</span>
            </div>
            <span class="font-semibold mono">${p.amount.toLocaleString()}원</span>
          </div>`).join('');
      } catch {}
    }

    // 멤버
    if (data?.vml_members) {
      try {
        const members = JSON.parse(data.vml_members);
        memberCount = members.length;
        memberHtml  = members.map(m => `
          <div class="flex items-center gap-2 py-1.5 border-b border-gray-50">
            <span class="w-5 h-5 rounded-full flex-shrink-0" style="background:${m.color || '#6366F1'}"></span>
            <span class="text-sm text-gray-800">${m.name}</span>
          </div>`).join('');
      } catch {}
    }

    document.getElementById('modalSub').textContent =
      `거래 ${txCount}건 · 고정지출 ${fixedCount}건 · 예정지출 ${planCount}건${memberCount > 0 ? ` · 멤버 ${memberCount}명` : ''}`;

    const section = (title, count, color, html) => count === 0 ? '' : `
      <div class="mb-5">
        <div class="flex items-center gap-2 mb-2">
          <h4 class="text-sm font-bold text-gray-700">${title}</h4>
          <span class="text-xs font-semibold px-1.5 py-0.5 rounded-full" style="background:${color}22;color:${color}">${count}건</span>
        </div>
        <div class="max-h-52 overflow-y-auto">${html || '<p class="text-xs text-gray-400">없음</p>'}</div>
      </div>`;

    document.getElementById('modalContent').innerHTML =
      section('거래 내역',  txCount,    '#6366F1', txHtml)    +
      section('고정지출',   fixedCount, '#8B5CF6', fixedHtml) +
      section('예정지출',   planCount,  '#EC4899', planHtml)  +
      section('멤버',       memberCount,'#10B981', memberHtml) ||
      '<p class="text-sm text-gray-400 text-center py-8">데이터 없음</p>';

  } catch (e) {
    document.getElementById('modalContent').innerHTML =
      `<p class="text-sm text-red-400 text-center py-8">오류: ${e.message}</p>`;
  }
}

function closeRoomModal() {
  document.getElementById('roomModal').classList.add('hidden');
  currentRoomId = null;
}

/* ── 룸 삭제 ── */
async function confirmDelete(roomId) {
  if (!confirm(`룸 "${roomId}"을 삭제하시겠습니까?\n해당 룸의 모든 데이터가 영구 삭제됩니다.`)) return;
  await fetch(`${FIREBASE_URL}/rooms/${roomId}.json?auth=${encodeURIComponent(adminSecret)}`, { method: 'DELETE' });
  closeRoomModal();
  loadRooms();
}

/* ── 자동 로그인 (세션 유지) ── */
const saved = sessionStorage.getItem('adminSecret');
if (saved) { adminSecret = saved; showDashboard(); }

document.getElementById('secretInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') adminLogin();
});
</script>
</body>
</html>
